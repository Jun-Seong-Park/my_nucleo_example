<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" font-family="'Courier New', Courier, monospace">

  <rect width="1400" height="1080" fill="white"/>

  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">택트 스위치 배선 - 구간을 잘라서 확인하기</text>

  <!-- ============================================================ -->
  <!-- 0. 빵판 기본 원리                                            -->
  <!-- ============================================================ -->
  <text x="60" y="90" font-size="18" font-weight="bold" fill="#004085">먼저 : 빵판은 세로로 연결됩니다</text>

  <rect x="60" y="105" width="500" height="175" fill="#f5f5f0" stroke="#999" stroke-width="2" rx="4"/>
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.2">
    <circle cx="120" cy="140" r="7"/><circle cx="180" cy="140" r="7"/><circle cx="240" cy="140" r="7"/><circle cx="300" cy="140" r="7"/><circle cx="360" cy="140" r="7"/><circle cx="420" cy="140" r="7"/><circle cx="480" cy="140" r="7"/>
    <circle cx="120" cy="170" r="7"/><circle cx="180" cy="170" r="7"/><circle cx="240" cy="170" r="7"/><circle cx="300" cy="170" r="7"/><circle cx="360" cy="170" r="7"/><circle cx="420" cy="170" r="7"/><circle cx="480" cy="170" r="7"/>
    <circle cx="120" cy="200" r="7"/><circle cx="180" cy="200" r="7"/><circle cx="240" cy="200" r="7"/><circle cx="300" cy="200" r="7"/><circle cx="360" cy="200" r="7"/><circle cx="420" cy="200" r="7"/><circle cx="480" cy="200" r="7"/>
    <circle cx="120" cy="230" r="7"/><circle cx="180" cy="230" r="7"/><circle cx="240" cy="230" r="7"/><circle cx="300" cy="230" r="7"/><circle cx="360" cy="230" r="7"/><circle cx="420" cy="230" r="7"/><circle cx="480" cy="230" r="7"/>
    <circle cx="120" cy="260" r="7"/><circle cx="180" cy="260" r="7"/><circle cx="240" cy="260" r="7"/><circle cx="300" cy="260" r="7"/><circle cx="360" cy="260" r="7"/><circle cx="420" cy="260" r="7"/><circle cx="480" cy="260" r="7"/>
  </g>
  <rect x="228" y="126" width="24" height="148" fill="#1a7a30" fill-opacity="0.15" stroke="#1a7a30" stroke-width="2.5" rx="11"/>

  <text x="590" y="150" font-size="15" fill="#1a7a30">초록 테두리 안 5개 구멍은</text>
  <text x="590" y="176" font-size="15" font-weight="bold" fill="#1a7a30">빵판 속에서 이미 이어져 있습니다</text>
  <text x="590" y="210" font-size="15" fill="#666">= 여기 어디에 꽂든 같은 지점</text>
  <text x="590" y="240" font-size="15" fill="#cc0000">옆 세로줄과는 이어지지 않습니다</text>
  <text x="590" y="266" font-size="15" fill="#cc0000">한 칸만 옆이어도 남남입니다</text>

  <!-- ============================================================ -->
  <!-- 1. 지금 상태                                                 -->
  <!-- ============================================================ -->
  <rect x="40" y="310" width="1320" height="150" fill="#e8f5ea" stroke="#1a7a30" stroke-width="2.5" rx="8"/>
  <text x="60" y="342" font-size="18" font-weight="bold" fill="#1a7a30">1단계  이미 확인 끝났습니다 (스위치·빵판 없이 직결)</text>

  <rect x="70" y="360" width="130" height="70" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="135" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#004085">보드</text>
  <text x="135" y="412" text-anchor="middle" font-size="13" fill="#004085">A3 = PB0</text>

  <line x1="200" y1="395" x2="420" y2="395" stroke="#1a7a30" stroke-width="5"/>

  <rect x="420" y="360" width="130" height="70" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="485" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#004085">보드 GND</text>

  <text x="590" y="388" font-size="15" fill="#1a7a30">→ PB0 가 LOW 로 떨어졌고 LED 가 멈췄습니다</text>
  <text x="590" y="416" font-size="15" fill="#1a7a30">→ 보드·핀·점퍼선·GND 전부 정상 확인</text>

  <!-- ============================================================ -->
  <!-- 2. 지금 할 것                                                -->
  <!-- ============================================================ -->
  <rect x="40" y="480" width="1320" height="270" fill="#fff8e5" stroke="#cc9900" stroke-width="3" rx="8"/>
  <text x="60" y="512" font-size="18" font-weight="bold" fill="#7a5c00">2단계  지금 해주실 것 : 스위치는 빼고, 두 선을 빵판 같은 세로줄에</text>

  <rect x="70" y="540" width="130" height="60" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="135" y="565" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">보드</text>
  <text x="135" y="586" text-anchor="middle" font-size="13" fill="#004085">A3 = PB0</text>

  <rect x="70" y="640" width="130" height="60" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="135" y="676" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">보드 GND</text>

  <line x1="200" y1="570" x2="480" y2="570" stroke="#cc6600" stroke-width="4"/>
  <line x1="480" y1="570" x2="480" y2="600" stroke="#cc6600" stroke-width="4"/>
  <line x1="200" y1="670" x2="480" y2="670" stroke="#333333" stroke-width="4"/>
  <line x1="480" y1="670" x2="480" y2="660" stroke="#333333" stroke-width="4"/>

  <!-- 빵판 -->
  <rect x="400" y="590" width="480" height="140" fill="#f5f5f0" stroke="#999" stroke-width="2" rx="4"/>
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.2">
    <circle cx="480" cy="615" r="8"/><circle cx="540" cy="615" r="8"/><circle cx="600" cy="615" r="8"/><circle cx="660" cy="615" r="8"/><circle cx="720" cy="615" r="8"/><circle cx="780" cy="615" r="8"/><circle cx="840" cy="615" r="8"/>
    <circle cx="480" cy="645" r="8"/><circle cx="540" cy="645" r="8"/><circle cx="600" cy="645" r="8"/><circle cx="660" cy="645" r="8"/><circle cx="720" cy="645" r="8"/><circle cx="780" cy="645" r="8"/><circle cx="840" cy="645" r="8"/>
    <circle cx="480" cy="675" r="8"/><circle cx="540" cy="675" r="8"/><circle cx="600" cy="675" r="8"/><circle cx="660" cy="675" r="8"/><circle cx="720" cy="675" r="8"/><circle cx="780" cy="675" r="8"/><circle cx="840" cy="675" r="8"/>
    <circle cx="480" cy="705" r="8"/><circle cx="540" cy="705" r="8"/><circle cx="600" cy="705" r="8"/><circle cx="660" cy="705" r="8"/><circle cx="720" cy="705" r="8"/><circle cx="780" cy="705" r="8"/><circle cx="840" cy="705" r="8"/>
  </g>
  <rect x="466" y="600" width="28" height="120" fill="#cc9900" fill-opacity="0.18" stroke="#cc9900" stroke-width="3" rx="13"/>
  <circle cx="480" cy="615" r="9" fill="#cc6600"/>
  <circle cx="480" cy="645" r="9" fill="#333333"/>

  <text x="910" y="612" font-size="15" font-weight="bold" fill="#7a5c00">두 선을 반드시</text>
  <text x="910" y="638" font-size="15" font-weight="bold" fill="#7a5c00">같은 세로줄에</text>
  <text x="910" y="670" font-size="14" fill="#7a5c00">위아래 구멍은 상관없고</text>
  <text x="910" y="694" font-size="14" fill="#7a5c00">세로줄만 같으면 됩니다</text>
  <text x="910" y="724" font-size="14" fill="#cc0000">중앙 홈은 넘지 마세요</text>

  <!-- ============================================================ -->
  <!-- 3. 마지막                                                    -->
  <!-- ============================================================ -->
  <rect x="40" y="770" width="1320" height="280" fill="#f2f2f2" stroke="#999" stroke-width="2" rx="8"/>
  <text x="60" y="802" font-size="18" font-weight="bold" fill="#444">3단계  2단계가 되면 그때 스위치를 끼웁니다 (지금은 하지 마세요)</text>

  <rect x="70" y="830" width="130" height="60" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="135" y="866" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">A3 = PB0</text>
  <rect x="70" y="940" width="130" height="60" fill="#cce5ff" stroke="#004085" stroke-width="2" rx="5"/>
  <text x="135" y="976" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">보드 GND</text>

  <line x1="200" y1="860" x2="480" y2="860" stroke="#cc6600" stroke-width="4"/>
  <line x1="480" y1="860" x2="480" y2="885" stroke="#cc6600" stroke-width="4"/>
  <line x1="200" y1="970" x2="700" y2="970" stroke="#333333" stroke-width="4"/>
  <line x1="700" y1="970" x2="700" y2="945" stroke="#333333" stroke-width="4"/>

  <rect x="400" y="875" width="480" height="115" fill="#f5f5f0" stroke="#999" stroke-width="2" rx="4"/>
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.2">
    <circle cx="480" cy="900" r="8"/><circle cx="540" cy="900" r="8"/><circle cx="600" cy="900" r="8"/><circle cx="660" cy="900" r="8"/><circle cx="720" cy="900" r="8"/><circle cx="780" cy="900" r="8"/><circle cx="840" cy="900" r="8"/>
    <circle cx="480" cy="930" r="8"/><circle cx="540" cy="930" r="8"/><circle cx="600" cy="930" r="8"/><circle cx="660" cy="930" r="8"/><circle cx="720" cy="930" r="8"/><circle cx="780" cy="930" r="8"/><circle cx="840" cy="930" r="8"/>
    <circle cx="480" cy="960" r="8"/><circle cx="540" cy="960" r="8"/><circle cx="600" cy="960" r="8"/><circle cx="660" cy="960" r="8"/><circle cx="720" cy="960" r="8"/><circle cx="780" cy="960" r="8"/><circle cx="840" cy="960" r="8"/>
  </g>

  <rect x="466" y="885" width="28" height="90" fill="#cc9900" fill-opacity="0.18" stroke="#cc9900" stroke-width="2.5" rx="13"/>
  <rect x="686" y="885" width="28" height="90" fill="#1a7a30" fill-opacity="0.18" stroke="#1a7a30" stroke-width="2.5" rx="13"/>

  <!-- 스위치 -->
  <rect x="470" y="890" width="250" height="46" fill="#ffffff" stroke="#444" stroke-width="3" rx="5"/>
  <circle cx="595" cy="913" r="16" fill="#ddd" stroke="#444" stroke-width="2.5"/>
  <circle cx="480" cy="900" r="9" fill="#cc6600"/>
  <circle cx="700" cy="900" r="9" fill="#333333"/>
  <text x="595" y="962" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">택트 스위치</text>

  <text x="910" y="898" font-size="15" fill="#444">스위치의 왼쪽 다리는 주황 줄에</text>
  <text x="910" y="924" font-size="15" fill="#444">오른쪽 다리는 초록 줄에</text>
  <text x="910" y="954" font-size="15" font-weight="bold" fill="#444">두 줄은 서로 다른 세로줄이어야 합니다</text>
  <text x="910" y="984" font-size="14" fill="#666">스위치를 누르면 그때 두 줄이 이어집니다</text>
  <text x="910" y="1014" font-size="14" fill="#cc0000">다리와 점퍼선이 같은 세로줄인지 꼭 확인</text>

</svg>
