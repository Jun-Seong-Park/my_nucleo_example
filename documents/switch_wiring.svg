<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1000" viewBox="0 0 1340 1000" font-family="'Courier New', Courier, monospace">

  <rect width="1340" height="1000" fill="white"/>

  <text x="670" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">택트 스위치 다리와 점퍼선 꽂는 자리</text>

  <!-- ============================================================ -->
  <!-- 위 : 스위치 자체 구조                                        -->
  <!-- ============================================================ -->
  <text x="60" y="88" font-size="18" font-weight="bold" fill="#004085">① 택트 스위치 4개 다리는 사실 2쌍입니다</text>

  <rect x="120" y="110" width="260" height="180" fill="#ffffff" stroke="#444" stroke-width="3" rx="6"/>
  <circle cx="250" cy="200" r="34" fill="#e8e8e8" stroke="#444" stroke-width="3"/>
  <text x="250" y="206" text-anchor="middle" font-size="13" fill="#666">버튼</text>

  <circle cx="150" cy="140" r="13" fill="#cc6600"/>
  <circle cx="150" cy="260" r="13" fill="#cc6600"/>
  <circle cx="350" cy="140" r="13" fill="#1a7a30"/>
  <circle cx="350" cy="260" r="13" fill="#1a7a30"/>

  <!-- 내부 연결 표시 -->
  <line x1="150" y1="140" x2="150" y2="260" stroke="#cc6600" stroke-width="6" stroke-dasharray="10,6"/>
  <line x1="350" y1="140" x2="350" y2="260" stroke="#1a7a30" stroke-width="6" stroke-dasharray="10,6"/>

  <text x="430" y="150" font-size="15" font-weight="bold" fill="#cc6600">왼쪽 다리 2개는 속에서 이미 붙어 있음</text>
  <text x="430" y="182" font-size="15" font-weight="bold" fill="#1a7a30">오른쪽 다리 2개도 속에서 붙어 있음</text>
  <text x="430" y="222" font-size="15" fill="#444">누르는 순간에만 주황 ↔ 초록 이 이어집니다</text>
  <text x="430" y="256" font-size="14" fill="#666">그래서 주황쪽에 신호선, 초록쪽에 GND 를 물리면</text>
  <text x="430" y="280" font-size="14" fill="#666">누를 때만 신호가 GND 로 떨어집니다</text>

  <!-- ============================================================ -->
  <!-- 아래 : 빵판에 꽂은 모습                                      -->
  <!-- ============================================================ -->
  <text x="60" y="350" font-size="18" font-weight="bold" fill="#004085">② 빵판에 꽂으면 이렇게 됩니다 (위에서 본 모습)</text>

  <!-- 열 번호 -->
  <g font-size="14" fill="#888" text-anchor="middle">
    <text x="200" y="392">17</text><text x="290" y="392">18</text><text x="380" y="392">19</text>
    <text x="470" y="392" font-weight="bold" fill="#cc6600">20</text>
    <text x="560" y="392">21</text>
    <text x="650" y="392" font-weight="bold" fill="#1a7a30">22</text>
    <text x="740" y="392">23</text><text x="830" y="392">24</text>
  </g>

  <!-- 행 라벨 -->
  <g font-size="14" fill="#888" text-anchor="end">
    <text x="170" y="425">A</text><text x="170" y="485">B</text><text x="170" y="545">C</text>
    <text x="170" y="605">D</text><text x="170" y="665">E</text>
  </g>

  <rect x="150" y="400" width="740" height="290" fill="#f5f5f0" stroke="#999" stroke-width="2" rx="4"/>

  <!-- 같은 열 강조 -->
  <rect x="452" y="405" width="36" height="278" fill="#cc6600" fill-opacity="0.13" stroke="#cc6600" stroke-width="3" rx="17"/>
  <rect x="632" y="405" width="36" height="278" fill="#1a7a30" fill-opacity="0.13" stroke="#1a7a30" stroke-width="3" rx="17"/>

  <!-- 구멍 -->
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.4">
    <circle cx="200" cy="420" r="10"/><circle cx="290" cy="420" r="10"/><circle cx="380" cy="420" r="10"/><circle cx="560" cy="420" r="10"/><circle cx="740" cy="420" r="10"/><circle cx="830" cy="420" r="10"/>
    <circle cx="200" cy="480" r="10"/><circle cx="290" cy="480" r="10"/><circle cx="380" cy="480" r="10"/><circle cx="470" cy="480" r="10"/><circle cx="560" cy="480" r="10"/><circle cx="650" cy="480" r="10"/><circle cx="740" cy="480" r="10"/><circle cx="830" cy="480" r="10"/>
    <circle cx="200" cy="540" r="10"/><circle cx="290" cy="540" r="10"/><circle cx="380" cy="540" r="10"/><circle cx="560" cy="540" r="10"/><circle cx="740" cy="540" r="10"/><circle cx="830" cy="540" r="10"/>
    <circle cx="200" cy="600" r="10"/><circle cx="290" cy="600" r="10"/><circle cx="380" cy="600" r="10"/><circle cx="470" cy="600" r="10"/><circle cx="560" cy="600" r="10"/><circle cx="650" cy="600" r="10"/><circle cx="740" cy="600" r="10"/><circle cx="830" cy="600" r="10"/>
    <circle cx="200" cy="660" r="10"/><circle cx="290" cy="660" r="10"/><circle cx="380" cy="660" r="10"/><circle cx="560" cy="660" r="10"/><circle cx="740" cy="660" r="10"/><circle cx="830" cy="660" r="10"/>
  </g>

  <!-- 스위치 몸통 (반투명) -->
  <rect x="430" y="515" width="260" height="175" fill="#ffffff" fill-opacity="0.75" stroke="#444" stroke-width="3" rx="6"/>
  <circle cx="560" cy="602" r="30" fill="#e8e8e8" fill-opacity="0.9" stroke="#444" stroke-width="2.5"/>

  <!-- 스위치 다리 -->
  <circle cx="470" cy="540" r="13" fill="#cc6600"/>
  <circle cx="470" cy="660" r="13" fill="#cc6600"/>
  <circle cx="650" cy="540" r="13" fill="#1a7a30"/>
  <circle cx="650" cy="660" r="13" fill="#1a7a30"/>

  <text x="560" y="712" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">택트 스위치 (다리 4개가 C행과 E행에)</text>

  <!-- 점퍼선 -->
  <circle cx="470" cy="420" r="12" fill="#cc6600" stroke="#ffffff" stroke-width="3"/>
  <circle cx="650" cy="420" r="12" fill="#333333" stroke="#ffffff" stroke-width="3"/>

  <line x1="470" y1="420" x2="470" y2="330" stroke="#cc6600" stroke-width="5"/>
  <line x1="650" y1="420" x2="650" y2="330" stroke="#333333" stroke-width="5"/>
  <text x="470" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#cc6600">신호선 (A3)</text>
  <text x="650" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">GND 선</text>

  <text x="920" y="440" font-size="15" font-weight="bold" fill="#cc6600">신호선은 20번 줄</text>
  <text x="920" y="466" font-size="14" fill="#666">스위치 왼쪽 다리와</text>
  <text x="920" y="490" font-size="14" fill="#666">같은 세로줄이면 됩니다</text>

  <text x="920" y="546" font-size="15" font-weight="bold" fill="#1a7a30">GND 선은 22번 줄</text>
  <text x="920" y="572" font-size="14" fill="#666">스위치 오른쪽 다리와</text>
  <text x="920" y="596" font-size="14" fill="#666">같은 세로줄이면 됩니다</text>

  <text x="920" y="650" font-size="14" fill="#cc0000">20 과 22 는 서로 다른 줄이라</text>
  <text x="920" y="674" font-size="14" fill="#cc0000">누르기 전에는 끊겨 있습니다</text>

  <!-- 중앙 홈 -->
  <rect x="150" y="690" width="740" height="34" fill="#e0e0d8" stroke="#bbb" stroke-width="1.5"/>
  <text x="520" y="713" text-anchor="middle" font-size="14" fill="#777">중앙 홈 - 이 아래는 다른 노드입니다</text>

  <!-- ============================================================ -->
  <!-- 하단 주의                                                    -->
  <!-- ============================================================ -->
  <rect x="60" y="760" width="1220" height="106" fill="#fff3cd" stroke="#cc9900" stroke-width="2.5" rx="6"/>
  <text x="80" y="790" font-size="16" font-weight="bold" fill="#7a5c00">순서가 중요합니다 - 스위치를 먼저 꽂고, 다리 위치를 눈으로 본 다음, 그 줄에 선을 꽂으세요</text>
  <text x="80" y="820" font-size="14" fill="#7a5c00">다리 간격이 두 칸이라 눈대중으로 선을 먼저 꽂으면 거의 어긋납니다. 위 그림의 20 / 22 는 예시일 뿐입니다.</text>
  <text x="80" y="848" font-size="14" fill="#7a5c00">스위치를 꽂은 뒤 실제 다리가 들어간 줄 번호를 확인하고, 그 줄의 빈 구멍에 선을 꽂으면 됩니다.</text>

  <rect x="60" y="886" width="1220" height="86" fill="#e8f5ea" stroke="#1a7a30" stroke-width="2.5" rx="6"/>
  <text x="80" y="916" font-size="16" font-weight="bold" fill="#1a7a30">확인 방법</text>
  <text x="80" y="944" font-size="14" fill="#1a7a30">안 누른 상태 → PB0 = 1 (HIGH)          누른 상태 → PB0 = 0 (LOW)</text>
  <text x="80" y="966" font-size="14" fill="#1a7a30">둘 다 LOW 라면 신호선과 GND 선이 같은 줄에 있는 것이고, 둘 다 HIGH 라면 다리와 선의 줄이 어긋난 것입니다.</text>

</svg>
